experiment:
  name: "wan21_14b_smoke_16ch"
  description: "80-step DROID render_v2 nominal robot-mesh preencoded training smoke"
  date: "2026-07-13"
  author: "Byungjun Kim"
  output_dir: "outputs/train_smoke_16ch"

pipeline:
  type: "wan2.1_fun_inp_hand_concat"
  base_model_name_or_path: "models/wan-base"
  fps: 16

transformer:
  class: "WanTransformer3DModelWithConcat"
  condition_channels: 16

training:
  mode: "lora"
  resume_from_checkpoint: null
  learning_rate: 1.0e-4
  batch_size: 1
  max_train_steps: 80
  gradient_accumulation_steps: 8
  optimizer: "adamw"
  weight_decay: 0.01
  lr_scheduler: "cosine_with_restarts"
  lr_warmup_steps: 100
  lr_num_cycles: 1
  max_grad_norm: 1.0
  beta1: 0.9
  beta2: 0.95
  seed: 42
  lora_rank: 64
  lora_alpha: 64
  trainable_parameter_patterns:
    - "patch_embedding"
  prompt_mode: "normal"
  validation_prompt_mode: "original"
  conditioning_mode: "dwm"
  robot_dropout_prob: 0.0
  custom_settings:
    distributed_backend: "deepspeed"
    mixed_precision: "bf16"
    gradient_checkpointing: true
    load_tensors: true
    random_flip: false
    max_num_frames: 81
    enable_slicing: true
    enable_tiling: true
    allow_tf32: true
    checkpointing_steps: 40
    run_initial_validation: false
    keep_full_state_checkpoints: 1

data:
  dataset_file:
    - "data/splits/smoke_train_16ch.txt"
  validation_set: null
  data_root: "data"
  fps: 16
  height_buckets: 480
  width_buckets: 832
  frame_buckets: 81
  max_num_frames: 81
  clip_start_frame_stride: 12
  dataloader_num_workers: 4
  pin_memory: true
  max_validation_videos: 0
  validation_steps: 1000000
  prompt_subdir: "videos_clips81_prompts_qwen3vl"
  prompt_json_fields:
    - "general.text"
  eager_load_prompts: false
  static_video_source_mode: "copy_first_frame"
  static_video_subdir: "static_videos_clips81"
  robot_mesh_video_subdir: "robot_mesh_videos_nominal_clips81"
  video_latents_subdir: "video_latents_clips81_480x832_wan"
  prompt_embeds_subdir: "prompt_embeds_qwen3vl_general_wan"
  static_video_latents_subdir: "static_video_latents_clips81_480x832_wan"
  robot_mesh_video_latents_subdir: "robot_mesh_videos_nominal_clips81_latents_480x832_wan"
  empty_prompt_embeds_path: "data/empty_prompt_embeds_wan.pt"

logging:
  report_to: "wandb"
  tracker_name: "wan21_14b_smoke_16ch"
  project_name: "world_model"
  entity_name: null
  log_steps: 1

environment:
  wandb_mode: "offline"
  tokenizers_parallelism: true
  omp_num_threads: 16
  pytorch_alloc_conf: "expandable_segments:True"
  nccl_timeout: 1800
