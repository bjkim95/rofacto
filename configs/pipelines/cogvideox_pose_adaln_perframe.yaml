pipeline:
  class: "CogVideoXPoseAdaLNPerFramePipeline"
  transformer_class: "CogVideoXTransformer3DModelWithAdaLNPosePerFrame"
  
adaln_perframe:
  smpl_pose_dim: 63
  smpl_embed_dim: 512
  stride: 4  # Stride for temporal processing

training_modes:
  full:
    description: "Full fine-tuning with per-frame AdaLN pose conditioning"
    supported: true
    default: true
    
  lora:
    description: "LoRA fine-tuning with per-frame AdaLN pose conditioning"
    supported: true
    default: false
    parameters:
      lora_rank: 64
      lora_alpha: 32

validation:
  enabled: true
  steps: 500
  epochs: 1
  max_videos: 4
