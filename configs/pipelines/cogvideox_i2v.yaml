pipeline:
  class: "CogVideoXImageToVideoPipeline"
  transformer_class: "CogVideoXTransformer3DModel"
  
training_modes:
  full:
    description: "Full fine-tuning of CogVideoX I2V model"
    supported: true
    default: true
    
  lora:
    description: "LoRA fine-tuning of CogVideoX I2V model"
    supported: true
    default: false
    parameters:
      lora_rank: 64
      lora_alpha: 32

validation:
  enabled: true
  steps: 500
  epochs: 1
  max_videos: 4


